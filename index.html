<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact form</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form class="form-card" novalidate>
      <h1 class="form-title">Get in touch</h1>
      <p class="form-subtitle">
        Tell us what you need and we'll reply within one business day.
      </p>

      <div class="field-row">
        <div class="field">
          <label class="label" for="first">First name</label>
          <input class="input" id="first" type="text" placeholder="Amina" />
        </div>
        <div class="field">
          <label class="label" for="last">Last name</label>
          <input class="input" id="last" type="text" placeholder="Wanjiru" />
        </div>
      </div>

      <!-- Example of the error state: remove is-invalid for the default look -->
      <div class="field is-invalid">
        <label class="label" for="email">Email</label>
        <input
          class="input"
          id="email"
          type="email"
          placeholder="you@example.com"
        />
        <p class="field-error">Enter a valid email address.</p>
      </div>

      <div class="field">
        <label class="label" for="topic">Topic</label>
        <select class="select" id="topic">
          <option>General question</option>
          <option>Support</option>
          <option>Billing</option>
        </select>
      </div>

      <div class="field">
        <label class="label" for="message">Message</label>
        <textarea
          class="textarea"
          id="message"
          placeholder="How can we help?"
        ></textarea>
      </div>

      <label class="checkbox">
        <input type="checkbox" />
        <span>Send me a copy of this message.</span>
      </label>

      <button class="button" type="submit">Send message</button>
    </form>
  </body>
</html>
